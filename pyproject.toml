[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "video-merger"
dynamic = ["version"]
description = "Merge multi-part videos (e.g. DMM downloads) into one file without re-encoding."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
video-merger = "video_merger.cli:main"

[tool.setuptools]
packages = ["video_merger"]

[tool.setuptools.package-data]
video_merger = ["web/*"]

[tool.setuptools.dynamic]
version = { attr = "video_merger.__version__" }
